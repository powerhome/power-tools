name: data_taster

on:
  push:

jobs:
  ruby:
    uses: powerhome/github-actions-workflows/.github/workflows/ruby-gem.yml@main
    with:
      package: ${{ github.workflow }}
      workdir: "packages/${{ github.workflow }}"
      # The runner image has no MySQL service, so start one with the root/root
      # credentials the specs expect, and wait until it accepts TCP connections.
      before_build: >-
        docker run --detach --name mysql --publish 3306:3306 --env MYSQL_ROOT_PASSWORD=root mysql:8.0 &&
        timeout 120 bash -c "until docker exec mysql mysql --host=127.0.0.1 --user=root --password=root --execute='SELECT 1' >/dev/null 2>&1; do sleep 2; done"
      gemfiles: "['gemfiles/rails_7_1.gemfile','gemfiles/rails_7_2.gemfile','gemfiles/rails_8_0.gemfile','gemfiles/rails_8_1.gemfile']"
      ruby: '["3.3"]'
    secrets: inherit
