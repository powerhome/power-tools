name: activerecord-mysql-rgeo

on:
  push:

jobs:
  ruby:
    uses: powerhome/github-actions-workflows/.github/workflows/ruby-gem.yml@main
    with:
      package: ${{ github.workflow }}
      workdir: "packages/${{ github.workflow }}"
      before_build: sudo apt-get update && sudo apt-get install -y libgeos-dev && sudo systemctl start mysql.service
      gemfiles: "['gemfiles/rails_7_2.gemfile','gemfiles/rails_8_0.gemfile','gemfiles/rails_8_1.gemfile','gemfiles/rails_edge.gemfile']"
      ruby: '["3.3", "3.4"]'
    secrets: inherit
