Cobra:
  Enabled: true

Cobra/CommandFilePlacement:
  Description: 'This cop disallows adding global helpers to the `app/commands` directory.'
  Enabled: true
  VersionAdded: '0.1.0'

Cobra/ControllerFilePlacement:
  Description: 'This cop disallows adding global controllers to the `app/controllers` directory.'
  Enabled: true
  VersionAdded: '0.1.0'

Cobra/DependencyVersion:
  Description: 'Gemspec dependencies should be declared with a version'
  Enabled: true
  VersionAdded: '0.1.0'

Cobra/DeprecatedConstant:
  Description: 'Flags references to constants the application has deprecated, such as a class left behind as a shim after moving to another component.'
  Enabled: true
  VersionAdded: '0.6.0'
  # The replacement only behaves the same once the deprecated class is a bare
  # shim, so autocorrect runs only with `rubocop -A`.
  SafeAutoCorrect: false
  # Each deprecated constant mapped to its replacement, e.g.
  #   Territory: Directory::Territory
  # The cop does nothing until the application lists at least one.
  Constants: {}

Cobra/EngineIsolateNamespace:
  Description: 'Rails engines must call `isolate_namespace` with their own namespace'
  Enabled: true
  VersionAdded: '0.6.0'

Cobra/GemRequirement:
  Description: 'Component Gemfile dependencies must specify "require: nil"'
  Enabled: true
  VersionAdded: '0.1.0'

Cobra/Inheritance:
  Description: 'Enforce classes inherit from their own modularized parent classes'
  Enabled: true
  VersionAdded: '0.1.0'

Cobra/JobFilePlacement:
  Description: 'This cop disallows adding global jobs to the `app/jobs` directory.'
  Enabled: true
  VersionAdded: '0.1.0'

Cobra/LibFilePlacement:
  Description: 'This cop disallows adding library files directly into the `lib/` directory.'
  Enabled: true
  VersionAdded: '0.1.0'

Cobra/MailerFilePlacement:
  Description: 'This cop disallows adding global helpers to the `app/mailers` directory.'
  Enabled: true
  VersionAdded: '0.1.0'

Cobra/ModelFilePlacement:
  Description: 'This cop disallows adding global models to the `app/models` directory.'
  Enabled: true
  VersionAdded: '0.1.0'

Cobra/PresenterFilePlacement:
  Description: 'This cop disallows adding global presenters to the `app/presenters` directory.'
  Enabled: true
  VersionAdded: '0.1.0'

Cobra/ViewComponentFilePlacement:
  Description: 'This cop disallows adding global view_components to the `app/components` directory.'
  Enabled: true
  VersionAdded: '0.4.0'
